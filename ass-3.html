<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 600px;
            border: 1px solid black;
            width: 100%;
            background-color: rgb(204, 55, 80);
        }
        .header{
            height: 20%;
            border: 1px solid black;
            width: 100%;
            background-color: teal;
        }
        .center{
            height: 60%;
            border: 1px solid black;
            width: 100%;
            display: flex;
            background-color: rgb(72, 204, 175);
        }
        .footer{
            height: 20%;
            border: 1px solid black;
            width: 100%;
            background-color: teal;
        }
        .left{
            height: 100%;
            width: 20%;
            border: 1px solid black;
            background-color: rgb(243, 194, 104);
        }
        .right{
            height: 100%;
            width: 80%;
            border: 1px solid black;
            background-color: rgb(171, 230, 217);

        }
        .top{
            height: 50%;
            width: 100%;
             background-color: rgb(250, 161, 59);
        }
        .bottom{
            height: 50%;
            width: 100%;
            border: 1px solid black;
            display: flex;
            background-color: brown;
        }
        .bottom-left{
            height: 100%;
            width: 50%;
            background-color: rgb(221, 129, 53);
        }
        .bottom-right{
            height: 100%;
            width: 50%;
           background-color: rgb(207, 164, 44);
        }
        *{
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
    <div class="header"></div>
    <div class="center">
        <div class="left"></div>
        <div class="right">
            <div class="top"></div>
            <div class="bottom">
                <div class="bottom-left"></div>
                <div class="bottom-right"></div>
            </div>
            </div>
        </div>
    <div class="footer"></div>
    </div>
</body>
</html>
