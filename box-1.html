<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            width: 800px; 
            background-color: teal;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        .box{
            height: 80%;
            width: 80%;
            background-color: blue;
            font-size: large;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
        }
        .box1{
            height: 80%;
            width: 80%;
            background-color: skyblue;
            border: 30px solid navy;
            margin: 30px 20px 20px 60px;
            padding: 60px 20px 20px 90px;
            text-align: center;
           
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .box2{
            height: 80%;
            width: 80%;
            background-color: orange;
            text-align: center;
            line-height: 120px;
        }
        .margin{
            position: absolute;
            top: 90px;
            left: 650px;
        }
        .box1>.border{
            position: absolute;
            top: 120px;
            left: 650px;
            color: white;
            text-align: center;
            
        }
        .padding{
            position: absolute;
            top: 150px;
            left: 650px;
            color: white;
            text-align: center;
    
          

        }
    </style>
</head>
<body>
    <h1 align="center"> BOX PLOTTING</h1>
    <div class="con">
        <div class="box">
            <p class=" margin">Margin</p>
            <div class="box1">
                <p class=" border">Border</p>
                <div class="box2">Content</div>
                <p class="padding">Padding</p>
            </div>
        </div>
    </div>
    
</body>
</html>
